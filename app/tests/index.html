<script>const OPOSICIONES = [];</script>
<!-- Una línea por oposición. Para añadir una nueva: crear data/nombre.js y añadir aquí su línea. -->
<script src="data/getxo-administrativo.js"></script>
<script src="data/abanto-administrativo.js"></script>
<script src="data/getxo-kirolak-auxiliar.js"></script>
<script src="data/biblioteca-dfb.js"></script>
<script src="data/ehu-administrativa.js"></script>
<script src="data/gobierno-vasco-administrativo.js"></script>

<script>const RESUMENES = {};</script>
<script src="data/resumenes-biblioteca.js"></script>
<script>var SUPUESTOS = {};</script>
<script src="data/supuestos-conserje.js"></script>
<script>
/* Un tema puede reutilizar preguntas de otro (de cualquier oposición): incluye:["opo/tema"], ["opo/tema:3-10"] o ["opo/tema:2-4+9"].
   Cada pregunta tiene una clave global k = "oposición de origen/id", para reconocerla aunque aparezca en varios temas u oposiciones. */
(function(){
  OPOSICIONES.forEach(op=>op.temas.forEach(t=>t.preguntas.forEach(p=>{p.k=op.id+"/"+p.id})));
  const buscar=(o,t)=>{const op=OPOSICIONES.find(x=>x.id===o);return op&&op.temas.find(x=>x.id===t)};
  OPOSICIONES.forEach(op=>op.temas.forEach(t=>{
    if(!t.incluye)return;
    const extra=[];
    t.incluye.forEach(ref=>{
      const m=ref.match(/^([^/]+)\/([^:]+)(?::(.+))?$/); if(!m)return;
      const src=buscar(m[1],m[2]); if(!src)return;
      let ps=src.preguntas.filter(p=>!p._inc);
      if(m[3]){const all=ps;ps=[];m[3].split("+").forEach(r=>{const [a,b]=r.split("-").map(Number);ps=ps.concat(all.slice(a-1,b||a))})}
      ps.forEach(p=>extra.push(Object.assign({},p,{q:p.q.replace(/^Solo Ayudante\.\s*/,""),_inc:1})));
    });
    t.preguntas=extra.concat(t.preguntas);
  }));
})();
const CORTO={"getxo-administrativo":"Getxo","abanto-administrativo":"Abanto","getxo-kirolak-auxiliar":"Getxo Kirolak","biblioteca-dfb":"Biblioteca DFB","ehu-administrativa":"UPV/EHU","getxo-conserje":"Getxo Conserje","gobierno-vasco-administrativo":"Gobierno Vasco"};
const corto=o=>CORTO[o.id]||o.nombre;
/* Cómo puntúa el examen real según las bases (para traducir el simulacro a puntos de verdad) */
const REAL={
  "getxo-conserje":{preguntas:100,acierto:.35,fallo:.12,max:35,aprobado:17.5,bases:"Examen real: 100 preguntas, +0,35 por acierto, −0,12 por fallo; la tabla de resultados puntúa sobre 35 (el aprobado sería la mitad, 17,5)."},
  "biblioteca-dfb":{preguntas:40,acierto:1,fallo:.33,bases:"Bases (parte teórica): 40 preguntas en 1 h 30 min, +1 por acierto, −0,33 por fallo. No indican nota mínima."},
  "ehu-administrativa":{preguntas:60,acierto:1,fallo:0,bases:"Bases: 60 preguntas en 80 minutos y los fallos no restan."}
};
const SIM_DEF={"biblioteca-dfb":{n:40,min:90,pena:"0.3333333333"}};
/* Puntos flojos detectados en exámenes reales: esos temas salen primero en la tanda del día */
const FOCO={
  "biblioteca-dfb":{temas:["t01","t02","t08","t09","t10"],nombre:"Constitución, Estatuto, euskera, igualdad y protección de datos",txt:"En los dos exámenes de Getxo (27/10) acertaste solo 5 de 24 preguntas de Constitución y Estatuto: ahora esos temas salen primero en tu tanda diaria, con las preguntas reales de los dos exámenes."},

};
/* Puntos flojos: los temas de FOCO (fallos en exámenes reales) hasta que los domines (15+ respondidas con 75 % o más),

function flojos(o){

const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const masDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

OPOSICIONES.forEach(o=>o.temas.forEach(t=>{

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Reúne preguntas sin repetir. temas: [{o,t}] */
function reunir(lista){
  const vistos=new Set(), out=[];
  lista.forEach(({o,t})=>t.preguntas.forEach(p=>{if(vistos.has(p.k))return;vistos.add(p.k);out.push({p,o,t})}));
  return out;
}
/* Materia común: preguntas que están en dos o más oposiciones */
function poolComun(){
  const out=[];
  DONDE.forEach((ds,k)=>{
    const opos=new Set(ds.map(d=>d.o.id)); if(opos.size<2)return;
    const d=ds.find(x=>!x.p._inc)||ds[0];
    out.push({p:d.p,o:d.o,t:d.t,opos:[...opos]});
  });
  return out;
}
const prioridad=it=>datos._q[it.p.k]===undefined?1:tocaHoy(it.p.k)?0:2;
function elegir(pool,n){
  const ord=barajar(pool).map(it=>({it,pr:prioridad(it)})).sort((a,b)=>a.pr-b.pr).map(x=>x.it);
  return barajar(ord.slice(0,n));
}
function resumenPool(pool){
  let f=0,nv=0;pool.forEach(it=>{const pr=prioridad(it);if(pr===0)f++;else if(pr===1)nv++});
  return `${pl(pool.length,"pregunta distinta","preguntas distintas")} · ${f} para repasar hoy · ${nv} sin ver`;
}

/* ---------- Portada ---------- */

  const h0=hoyISO(), exDe=o=>EXAMENES.find(e=>e.id===o.id&&e.fecha>=h0);
  const orden=visibles.slice().sort((a,b)=>{const ea=exDe(a),eb=exDe(b);return ea&&eb?ea.fecha.localeCompare(eb.fecha):ea?-1:eb?1:0});

/* ---------- Leer el tema ---------- */
/* Formato de los resúmenes: "## Título", "### Subtítulo", "- punto", párrafos; **negrita** */
function md(txt){
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,"$1<i>$2</i>");
  let h="",pila=[];
  const cerrar=n=>{while(pila.length>n)h+=pila.pop()==="ol"?"</li></ol>":"</li></ul>"};
  txt.trim().split("\n").forEach(l=>{
    const m=l.match(/^(\s*)(- |\d+\. )(.*)$/);
    if(m){
      const nivel=m[1].length>=2?2:1, tipo=m[2]==="- "?"ul":"ol";
      if(pila.length<nivel){h+=`<${tipo}>`;pila.push(tipo)}
      else{cerrar(nivel);if(pila[nivel-1]!==tipo){h+=pila.pop()==="ol"?"</li></ol>":"</li></ul>";h+=`<${tipo}>`;pila.push(tipo)}else h+="</li>"}
      h+=`<li>${inl(m[3])}`;return;
    }
    cerrar(0);
    l=l.trim(); if(!l)return;
    if(l.startsWith("### "))h+=`<h3>${inl(l.slice(4))}</h3>`;
    else if(l.startsWith("## "))h+=`<h2>${inl(l.slice(3))}</h2>`;
    else h+=`<p>${inl(l)}</p>`;
  });
  cerrar(0);
  return h;
}
/* El resumen se lee por apartados (cada «## »), para no tener que leerlo todo de golpe */
function partes(txt){
  const ps=[];let intro=[],cur=null;
  txt.trim().split("\n").forEach(l=>{
    if(l.startsWith("## ")){cur={t:l.slice(3).trim(),c:[]};ps.push(cur)}
    else (cur?cur.c:intro).push(l);
  });
  return {intro:intro.join("\n"),ps:ps.map(p=>({t:p.t,c:p.c.join("\n")}))};
}
const minutos=txt=>Math.max(1,Math.round(txt.split(/\s+/).length/170));
function leerTema(tid,vista){

  let h=`<button class="volver" id="vol">← ${esc(corto(opo))}</button><p class="tag">${esc(t.sig||"")}</p><h1>${esc(t.titulo)}</h1>

  if(vista==="resumen"){

    <div class="avance"><div class="progreso" style="margin:0"><i style="width:${hechas.size/ps.length*100}%"></i></div><span>${hechas.size} de ${ps.length} leídos</span></div>
    <div class="lectura">${intro.trim()?md(intro):""}</div>`;
    ps.forEach((p,i)=>{
      const ok=hechas.has(i);
      h+=`<details class="parte${ok?" hecha":""}" ${i===sig?"open":""}><summary><span class="num">${ok?"✓":i+1}</span><span class="tit">${esc(p.t)}</span><span class="min">${minutos(p.c)} min</span></summary>
      <div class="lectura">${md(p.c)}</div><div class="acciones" style="margin-top:4px"><button class="btn ${ok?"sec":""}" data-sec="${i}">${ok?"Marcar como no leído":i===ps.length-1?"Leído":"Leído, siguiente apartado"}</button></div></details>`;
    });
    h+=hechas.size===ps.length?`<p class="ok-txt">Has leído todo el resumen. Ahora haz el test para fijarlo.</p>`:"";
  }else{
    h+=`<p class="lead" style="margin-top:4px">Cada pregunta del banco con su respuesta correcta. Para estudiar activamente, oculta las respuestas e intenta decirlas antes de tocar.</p>
    <div class="chips"><button class="chip" id="ocultar" aria-pressed="false">Ocultar respuestas</button></div>
    <div class="lectura"><ul class="claves" id="claves">${t.preguntas.map(p=>`<li><div class="q">${esc(p.q.replace(/^Solo Ayudante\.\s*/,""))}</div><div class="r">${esc(correcta(p))}</div>${p.e?`<div class="e">${esc(p.e)} <span class="ref">${esc(p.r||"")}</span></div>`:""}</li>`).join("")}</ul></div>`;
  }
  h+=`<button class="btn siguiente" id="hecho">Hacer el test de este tema</button>`;
  app.innerHTML=h;
  document.getElementById("vol").onclick=()=>temas(opo.id,OPOSICIONES.length===1);
  app.querySelectorAll("[data-vista]").forEach(c=>c.onclick=()=>leerTema(tid,c.dataset.vista));
  app.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.sec, s=new Set(datos._secs[key]||[]);
    if(s.has(i))s.delete(i);else s.add(i);
    datos._secs[key]=[...s];
    const total=partes(res).ps.length;
    if(s.size===total)datos._leido[key]=hoyISO();
    guardar(datos);
    leerTema(tid,"resumen");
    const nx=app.querySelector("details.parte[open]"); if(nx&&s.has(i))nx.scrollIntoView({block:"start"});
  });
  const ul=document.getElementById("claves"), oc=document.getElementById("ocultar");
  if(ul){
    oc.onclick=()=>{const on=!ul.classList.contains("ocultas");ul.classList.toggle("ocultas",on);oc.setAttribute("aria-pressed",on);oc.textContent=on?"Mostrar respuestas":"Ocultar respuestas";ul.querySelectorAll("li").forEach(li=>li.classList.remove("ver"))};
    ul.onclick=e=>{const li=e.target.closest("li");if(li&&ul.classList.contains("ocultas"))li.classList.toggle("ver")};
  }
  document.getElementById("hecho").onclick=()=>empezarTema(tid,"todo");
  arriba();
}


/* ---------- Aprender jugando ----------
   Cada tema se parte en lecciones cortas de 5 datos, en el orden de la ley (por artículo).
   Primero ves cada dato (con la pregunta como pista, para pensar antes), y después te pregunta
   esas mismas 5: lo que fallas vuelve al final hasta que lo aciertas. Las respuestas cuentan
   para el repaso espaciado y para tu nivel, igual que en los tests. */
const POR_LECCION=5;
const qLimpia=p=>String(p.q).replace(/^Solo Ayudante\.\s+/,"").replace(/^Solo Ayudante\./,"");
function refOrden(p){
  const r=String(p.r||"").split("·")[0].trim();
  const m=r.match(/^(.*?)\s*arts?\.?\s*(\d+)/i);
  return m?{ley:m[1].trim()||r,art:+m[2]}:{ley:r,art:9999};
}
function lecciones(t){
  const ps=t.preguntas.map((p,i)=>({p,i,...refOrden(p)}));
  const leyes=[];ps.forEach(x=>{if(!leyes.includes(x.ley))leyes.push(x.ley)});
  const titulo=g=>{const arts=g.filter(x=>x.art<9999).map(x=>x.art), ley=g[0].ley;
    if(!arts.length)return ley.length>60?ley.slice(0,57)+"…":(ley||"Varios");
    const a=Math.min(...arts),z=Math.max(...arts);return (ley?ley+" · ":"")+(a===z?"art. "+a:"arts. "+a+"–"+z)};
  const L=[], sueltas=[];
  leyes.forEach(ley=>{
    const g=ps.filter(x=>x.ley===ley).sort((a,b)=>a.art-b.art||a.i-b.i);
    if(g.length<3){sueltas.push(...g);return}
    const trozos=[];for(let i=0;i<g.length;i+=POR_LECCION)trozos.push(g.slice(i,i+POR_LECCION));
    if(trozos.length>1&&trozos[trozos.length-1].length<3)trozos[trozos.length-2].push(...trozos.pop());
    trozos.forEach(tr=>L.push({tit:titulo(tr),ps:tr.map(x=>x.p)}));
  });
  for(let i=0;i<sueltas.length;i+=POR_LECCION){
    let tr=sueltas.slice(i,i+POR_LECCION);
    if(tr.length<3&&L.length&&i===0&&sueltas.length<3){L[L.length-1].ps.push(...tr.map(x=>x.p));break}
    const nombres=[...new Set(tr.map(x=>x.ley).filter(Boolean))];
    const tt=nombres.join(" · ");
    L.push({tit:nombres.length===1&&tt.length<=60?tt:"Otras normas del tema",ps:tr.map(x=>x.p)});
  }
  return L;
}
const aprKey=tid=>opo.id+"/"+tid;
function temaAprender(o){
  const conT=o.temas.filter(t=>t.preguntas.length), ap=datos._apr||{};
  const ult=datos._aprUlt&&datos._aprUlt.startsWith(o.id+"/")?datos._aprUlt.split("/")[1]:null;
  const pend=t=>{const s=ap[o.id+"/"+t.id]||{};return lecciones(t).some((_,i)=>!s[i])};
  return (ult&&conT.find(t=>t.id===ult&&pend(t)))||conT.find(pend)||conT[0]||null;
}
function abrirAprender(oid){const o=OPOSICIONES.find(x=>x.id===oid);if(!o)return;opo=o;const t=temaAprender(o);if(t)mapaAprender(t.id)}
const estrellas=(n,max)=>'<span class="estr" aria-label="'+n+' de 3 estrellas">'+"★".repeat(n)+'<span class="off">'+"★".repeat((max||3)-n)+"</span></span>";
function datoConRespuesta(p){
  const e=String(p.e||correcta(p)), c=String(correcta(p)).replace(/[.\s]+$/,"");
  const k=c.length>3?e.toLowerCase().indexOf(c.toLowerCase()):-1;
  return k<0?esc(e):esc(e.slice(0,k))+"<b>"+esc(e.slice(k,k+c.length))+"</b>"+esc(e.slice(k+c.length));
}
function mapaAprender(tid){
  const t=opo.temas.find(x=>x.id===tid), L=lecciones(t);
  datos._aprUlt=opo.id+"/"+tid;
  datos._apr=datos._apr||{};const st=datos._apr[aprKey(tid)]||{};
  const total=L.reduce((s,_,i)=>s+(st[i]||0),0), sig=L.findIndex((_,i)=>!st[i]);
  let h=`<button class="volver" id="vol">← ${esc(corto(opo))}</button><p class="tag">${esc(t.sig||"")}</p><h1>Aprender jugando</h1>
  <p class="lead">${esc(nombreTema(t))}. ${L.length} lecciones de ${POR_LECCION} datos, en el orden de la ley. En cada una primero aprendes y luego te pregunta justo eso. Llevas ${estrellas(Math.min(3,Math.round(total/Math.max(1,L.length))))} · ${total} de ${L.length*3} estrellas.</p>
  ${sig>=0?`<div class="acciones" style="margin:0 0 16px"><button class="btn" data-l="${sig}">${sig?"Seguir: lección "+(sig+1):"Empezar la lección 1"}</button></div>`:`<p class="ok-txt">Has hecho todas las lecciones. Repite las que tengan menos estrellas o haz el test del tema.</p>`}
  <ol class="apr-mapa">`;
  L.forEach((l,i)=>{const s=st[i]||0;
    h+=`<li><button data-l="${i}" class="${s?"hecha":""}${i===sig?" sig":""}"><span class="n">${s?"✓":i+1}</span><span><b>${esc(l.tit)}</b><small>${l.ps.length} datos</small></span>${estrellas(s)}</button></li>`});
  h+=`</ol><button class="btn siguiente" id="test">Hacer el test de este tema</button>`;
  app.innerHTML=h;
  document.getElementById("vol").onclick=()=>temas(opo.id,OPOSICIONES.length===1);
  document.getElementById("test").onclick=()=>empezarTema(tid,"todo");
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>leccion(tid,+b.dataset.l));
  arriba();
}
function leccion(tid,li){
  const t=opo.temas.find(x=>x.id===tid), L=lecciones(t), l=L[li];
  const a={tid,li,tit:l.tit,ps:l.ps,i:0,cola:[],fallos:0,primera:new Set(),combo:0,mejorCombo:0,hechas:0};
  aprTarjeta(a);
}
function aprPuntos(n,ya){let h='<div class="puntos-apr" aria-hidden="true">';for(let i=0;i<n;i++)h+=`<i class="${i<ya?"ya":""}"></i>`;return h+"</div>"}
function aprTarjeta(a){
  const p=a.ps[a.i], ref=String(p.r||"").split("·")[0].trim();
  let h=`<div class="barra"><button id="salir">Salir</button><span>Aprende · ${a.i+1} de ${a.ps.length}</span><span></span></div>

    const b=document.getElementById("sig");b.focus({preventScroll:true});
    b.onclick=()=>{if(ult){a.cola=barajar(a.ps.slice());a.total=a.ps.length;aprPregunta(a)}else{a.i++;aprTarjeta(a)}};
  };
  arriba();
}
function aprPregunta(a){
  const p=a.cola[0], ops=opciones(p);
  let h=`<div class="barra"><button id="salir">Salir</button><span>¿Te acuerdas? · quedan ${a.cola.length}</span>${a.combo>1?`<span class="combo">🔥 ${a.combo} seguidas</span>`:"<span></span>"}</div>
  <div class="progreso"><i style="width:${50+(a.hechas/a.total)*50}%"></i></div>
  <p class="pregunta">${esc(qLimpia(p))}</p><div class="opciones">`;
  ops.forEach((o,k)=>{h+=`<button class="op" data-k="${k}"><b>${"abcd"[k]})</b><span>${esc(o.txt)}</span></button>`});
  h+='</div><div id="tras"></div>';
  app.innerHTML=h;
  document.getElementById("salir").onclick=()=>mapaAprender(a.tid);
  const bs=[...app.querySelectorAll(".op")];
  bs.forEach(b=>b.onclick=()=>{
    const ok=ops[+b.dataset.k].ok;
    bs.forEach((x,k)=>{x.disabled=true;if(ops[k].ok)x.classList.add("ok")});
    if(!a.primera.has(p.k)){a.primera.add(p.k);registrar(p,ok)}
    a.cola.shift();
    if(ok){a.hechas++;a.combo++;a.mejorCombo=Math.max(a.mejorCombo,a.combo)}
    else{b.classList.add("bad");a.fallos++;a.combo=0;a.cola.push(p)}
    const fin=!a.cola.length;
    document.getElementById("tras").innerHTML=`<div class="explica"><strong>${ok?(a.combo>2?"¡Imparable!":"¡Eso es!"):"Casi. Te la vuelvo a preguntar al final."}</strong>${esc(p.e||"")}<div class="ref">${esc(p.r||"")}</div></div>
    <button class="btn siguiente" id="sig">${fin?"Ver cómo te ha ido":"Siguiente"}</button>`;
    const s=document.getElementById("sig");s.focus({preventScroll:true});s.scrollIntoView({block:"nearest"});
    s.onclick=()=>fin?aprFin(a):aprPregunta(a);
  });
  arriba();
}
function aprFin(a){
  const st=a.fallos===0?3:a.fallos<=2?2:1;
  datos._apr=datos._apr||{};const k=aprKey(a.tid);datos._apr[k]=datos._apr[k]||{};
  const antes=datos._apr[k][a.li]||0;datos._apr[k][a.li]=Math.max(antes,st);guardar(datos);
  const t=opo.temas.find(x=>x.id===a.tid), L=lecciones(t), hay=a.li+1<L.length;
  const xp=a.total*10-a.fallos*3+(a.mejorCombo>=a.total?10:0);
  const msg=st===3?"¡Perfecta! Todo a la primera.":st===2?"¡Muy bien! Casi todo a la primera.":"Hecho. Las que te han costado volverán en el repaso de mañana.";
  app.innerHTML=`<div class="premio"><p class="tag">${esc(a.tit)}</p><div class="grande">${"★".repeat(st)}<span style="color:var(--line)">${"★".repeat(3-st)}</span></div>
  <h1 style="margin-top:6px">${msg}</h1><p class="xp">+${Math.max(5,xp)} puntos${a.mejorCombo>2?` · 🔥 racha de ${a.mejorCombo}`:""}</p>

  <div class="acciones" style="justify-content:center">${hay?`<button class="btn" id="otra">Siguiente lección</button>`:""}<button class="btn sec" id="rep">Repetir esta</button><button class="btn sec" id="mapa">Ver todas las lecciones</button></div>`;
  if(hay)document.getElementById("otra").onclick=()=>leccion(a.tid,a.li+1);

  arriba();

/* ---------- Test por tema ---------- */
function empezarTema(tid,modo){
  const t=opo.temas.find(x=>x.id===tid), s=estado(opo.id,tid);
  const ps=modo==="falladas"?t.preguntas.filter(p=>s.falladas.includes(fk(p))):t.preguntas;
  ses={tipo:"tema",t,modo,items:barajar(ps).map(p=>({p,o:opo,t})),i:0,aciertos:0,fallos:[],
    repetir:()=>empezarTema(tid,"todo")};
  pregunta();
}

/* ---------- Popurrí ---------- */
function configPopurri(oid){
  pararReloj();
  const o=oid?OPOSICIONES.find(x=>x.id===oid):null;
  const cfgKey="pop:"+(oid||"comun");
  const cfg=Object.assign({n:20,temas:null},datos._cfg[cfgKey]);
  const conPreg=o?o.temas.filter(t=>t.preguntas.length):[];
  let marcados=new Set(cfg.temas&&o?cfg.temas.filter(id=>conPreg.some(t=>t.id===id)):conPreg.map(t=>t.id));
  const pool=()=>o?reunir(conPreg.filter(t=>marcados.has(t.id)).map(t=>({o,t}))):poolComun();
  let h=`<button class="volver" id="vol">← ${o?esc(corto(o)):"Oposiciones"}</button>
  <h1>Popurrí${o?"":" común"}</h1><p class="lead">${o?esc(o.nombre):"Materia que comparten tus oposiciones."} Primero salen las que toca repasar hoy (las falladas vuelven al día siguiente; las acertadas, a los 3, 7, 14 y 30 días), luego las que no has visto y por último el resto.</p>
  <h2 class="apartado">Cuántas preguntas</h2><div class="chips" id="chips">`;

  h+='</div>';
  if(o){
    h+=`<h2 class="apartado">De qué temas</h2><div class="chips"><button class="chip" id="todos">Todos</button><button class="chip" id="ninguno">Ninguno</button></div><div class="lista-temas">`;
    conPreg.forEach(t=>{h+=`<label class="tema-check"><input type="checkbox" value="${t.id}" ${marcados.has(t.id)?"checked":""}><span><b>${esc(t.sig||"")}</b> ${esc(t.titulo.replace(/^Tema \d+\.\s*/,""))}</span></label>`});
    h+='</div>';
  }
  h+=`<p class="resumen" id="res"></p><button class="btn siguiente" id="go">Empezar el popurrí</button>`;
  app.innerHTML=h;
  const res=document.getElementById("res"), go=document.getElementById("go");
  const pintar=()=>{const pl=pool();res.textContent=pl.length?resumenPool(pl)+".":"Marca al menos un tema.";go.disabled=!pl.length};
  pintar();
  document.getElementById("vol").onclick=()=>o?temas(o.id,OPOSICIONES.length===1):portada();
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;app.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  if(o){
    const cajas=[...app.querySelectorAll(".tema-check input")];
    const leer=()=>{marcados=new Set(cajas.filter(c=>c.checked).map(c=>c.value));pintar()};
    cajas.forEach(c=>c.onchange=leer);
    document.getElementById("todos").onclick=()=>{cajas.forEach(c=>c.checked=true);leer()};
    document.getElementById("ninguno").onclick=()=>{cajas.forEach(c=>c.checked=false);leer()};
  }
  go.onclick=()=>{
    datos._cfg[cfgKey]={n:cfg.n,temas:o?[...marcados]:null};guardar(datos);
    const pl=pool();
    const empezar=()=>{
      ses={tipo:"popurri",comun:!o,items:elegir(pool(),cfg.n||pl.length),i:0,aciertos:0,fallos:[],
        repetir:empezar,ajustes:()=>configPopurri(oid)};
      pregunta();
    };
    empezar();
  };
  arriba();
}

/* ---------- Pregunta (tema y popurrí) ---------- */
function etiqueta(it){
  if(ses.tipo==="tema")return "";
  const lugar=ses.comun?`${esc(corto(it.o))} · ${esc(it.t.sig||"")}`:esc(it.t.sig||"");
  return `<p class="tag">${lugar} — ${esc(it.t.titulo.replace(/^Tema \d+\.\s*/,""))}</p>`;
}
function pregunta(){
  const it=ses.items[ses.i], p=it.p, n=ses.items.length;
  const ops=opciones(p);
  const piensa=datos._cfg.piensa!==false;
  let h=`<div class="barra"><button id="salir">Salir</button><span>Pregunta ${ses.i+1} de ${n}</span><button class="toggle" id="tgp" aria-pressed="${piensa}" title="Ver la pregunta sin opciones para pensar antes la respuesta">Piensa primero: ${piensa?"sí":"no"}</button></div>
  <div class="progreso"><i style="width:${(ses.i/n)*100}%"></i></div>${etiqueta(it)}
  <p class="pregunta">${esc(p.q)}</p>`;

  h+=`<div class="opciones" id="ops"${piensa?" hidden":""}>`;

  let noSe=false;
  document.getElementById("tgp").onclick=()=>{datos._cfg.piensa=!piensa;guardar(datos);pregunta()};
  if(piensa){
    const ver=()=>{document.getElementById("piensa").remove();const o=document.getElementById("ops");o.hidden=false;o.querySelector(".op").focus({preventScroll:true})};

    document.getElementById("nose").onclick=()=>{noSe=true;ver()};
  }

  const botones=[...app.querySelectorAll(".op")];
  botones.forEach(b=>b.onclick=()=>{
    const elegida=ops[+b.dataset.k];

    const avanzar=()=>{if(ult)resultado();else{ses.i++;pregunta();arriba()}};
    const preguntaConf=elegida.ok&&!noSe;
    if(elegida.ok&&noSe){confianza(p,0);it.conf=0;ses.suerte=(ses.suerte||0)+1}
    let pie;
    if(preguntaConf)pie=`<div class="conf"><p>¿Cómo de segura estabas?</p><div class="tres">
      <button class="c2" data-c="2">Lo sabía<small>vuelve en días</small></button>
      <button class="c1" data-c="1">Dudé<small>vuelve antes</small></button>
      <button class="c0" data-c="0">Adiviné<small>vuelve mañana</small></button></div></div>`;
    else pie=`<button class="btn siguiente" id="sig">${ult?"Ver el resultado":"Siguiente pregunta"}</button>`;
    const nota=elegida.ok&&noSe?`<p class="pista">Como no lo sabías, cuenta como acierto de suerte y volverá mañana.</p>`:"";
    document.getElementById("tras").innerHTML=`<div class="explica"><strong>${elegida.ok?"Correcto.":"No es esa."}</strong>${esc(p.e||"")}<div class="ref">${esc(p.r||"")}</div></div>${nota}
    <button class="enlace" id="avisar">¿Ves algo mal en esta pregunta? Avísame</button><div id="avisobox"></div>${pie}`;
    document.getElementById("avisar").onclick=()=>formAviso(it,document.getElementById("avisobox"),document.getElementById("avisar"));
    const foco=document.getElementById("sig")||app.querySelector(".conf button");
    foco.focus({preventScroll:true});
    foco.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    if(preguntaConf)app.querySelectorAll("[data-c]").forEach(cb=>cb.onclick=()=>{
      const c=+cb.dataset.c;confianza(p,c);it.conf=c;
      if(c===0)ses.suerte=(ses.suerte||0)+1;else if(c===1)ses.dudas=(ses.dudas||0)+1;
      avanzar();
    });
    else document.getElementById("sig").onclick=avanzar;
  });
}

/* ---------- Avisos de preguntas que parecen mal ---------- */
let avisosCol=null;
function formAviso(it,box,btn){
  btn.hidden=true;
  box.innerHTML=`<div class="aviso-form"><label for="avtxt" style="font-weight:700;font-size:.9rem;color:var(--soft)">Qué te parece mal (por ejemplo: «la correcta es la b según el art. 30»)</label><textarea id="avtxt" maxlength="1000"></textarea><div class="acciones" style="margin-top:0"><button class="btn sec" id="avno">Cancelar</button><button class="btn" id="avsi">Enviar aviso</button></div></div>`;
  const ta=document.getElementById("avtxt");ta.focus();
  document.getElementById("avno").onclick=()=>{box.innerHTML="";btn.hidden=false};
  document.getElementById("avsi").onclick=async()=>{
    const nota=ta.value.trim();if(!nota){ta.focus();return}
    const p=it.p, t=Date.now();
    const doc={k:p.k,oposicion:it.o.nombre,tema:(it.t.sig||"")+" "+it.t.titulo,pregunta:p.q,opciones:p.o,respuestaPuesta:correcta(p),nota,t,estado:"pendiente"};
    let ok=false;
    if(avisosCol){try{await avisosCol.doc(p.k.replace(/[^A-Za-z0-9_\-.]/g,"_")+"-"+t).set(doc);ok=true}catch(e){}}
    if(!ok){datos._avisos=datos._avisos||[];datos._avisos.push(doc);guardar(datos)}
    box.innerHTML=`<p class="ok-txt">${ok?"Aviso enviado. Lo revisaré y corregiré la pregunta si hace falta.":"Aviso guardado en este dispositivo. Se enviará cuando vuelva la conexión."}</p>`;
  };
}

/* Tabla de resultado por temas: filas {nombre, bien, total} ordenadas de peor a mejor */
function tablaTemas(items,comun){
  const g=new Map();
  items.forEach(it=>{
    const key=it.o.id+"/"+it.t.id;
    if(!g.has(key))g.set(key,{nombre:(comun?corto(it.o)+" · ":"")+(it.t.sig||"")+" — "+it.t.titulo.replace(/^Tema \d+\.\s*/,""),bien:0,total:0});
    const r=g.get(key);r.total++;if(it.ok)r.bien++;
  });
  const filas=[...g.values()].sort((a,b)=>a.bien/a.total-b.bien/b.total||b.total-a.total);
  let h='<h2 class="apartado">Por temas</h2><ul class="por-tema">';
  filas.forEach(r=>{const pct=r.bien/r.total;h+=`<li><span>${esc(r.nombre)}</span><b class="${pct<.5?"mal":pct<.8?"medio":"bien"}">${r.bien} de ${r.total}</b></li>`});
  return h+'</ul>';
}
function listaFallos(items,simul){
  if(!items.length)return "";
  let h=`<h2 class="apartado">${simul?"Fallos y en blanco":"Las que has fallado"}</h2><ul class="fallos">`;
  items.forEach(it=>{
    const tuya=simul&&it.resp!=null?`<div class="tuya">Tu respuesta: ${esc(it.ops[it.resp].txt)}</div>`:simul?'<div class="tuya">En blanco</div>':"";
    h+=`<li><div class="q">${esc(it.p.q)}</div>${tuya}<div class="r">${esc(correcta(it.p))}</div><div class="ref">${esc(it.p.r||"")}${it.p.e?" · "+esc(it.p.e):""}</div></li>`;
  });
  return h+'</ul>';
}

function resultado(){
  const n=ses.items.length, a=ses.aciertos;
  let h;
  if(ses.tipo==="tema"){
    const s=estado(opo.id,ses.t.id);
    if(ses.modo==="todo"&&(s.mejor===null||a>s.mejor))s.mejor=a;
    guardar(datos);
  }
  const pct=a/n;
  const msg=pct===1?"Todas bien.":pct>=.8?"Muy bien. Repasa las que has fallado y vuelve en unos días.":pct>=.5?"Vas por buen camino. Relee los artículos de las falladas antes de repetir.":"Conviene releer los temas que peor te han ido antes de repetir.";
  const su=ses.suerte||0, du=ses.dudas||0, seg=a-su;
  const desglose=su||du?`<div class="real"><div>De verdad sabías</div><div class="pts">${seg} <small style="font-size:1rem;color:var(--soft)">de ${n}</small></div><p>${pl(a,"acierto","aciertos")}: ${a-su-du} lo sabías, ${du} con dudas y ${su} de suerte. Las de suerte cuentan como falladas: volverán mañana.</p></div>`:"";
  h=`<h1>Resultado</h1><p class="nota">${a} de ${n}</p><p class="lead">${msg}</p>${desglose}<div class="acciones">`;
  if(ses.tipo==="tema"){
    const s=estado(opo.id,ses.t.id), f=ses.t.preguntas.filter(p=>s.falladas.includes(fk(p))).length;
    h+=`<button class="btn" id="rep">Repetir el test</button><button class="btn sec" id="fal" ${f?"":"disabled"}>Repasar falladas (${f})</button>`;
  }else h+='<button class="btn" id="rep">Otro popurrí igual</button><button class="btn sec" id="aj">Cambiar ajustes</button>';
  h+=`<button class="btn sec" id="vol">${opo?"Volver a los temas":"Volver al inicio"}</button></div>`;
  if(ses.tipo!=="tema")h+=tablaTemas(ses.items,ses.comun);
  h+=listaFallos(ses.fallos,false);
  const suerte=ses.items.filter(it=>it.ok&&it.conf===0);
  if(suerte.length)h+=listaFallos(suerte,false).replace("Las que has fallado","Las que acertaste de suerte");
  app.innerHTML=h;
  const tid=ses.t&&ses.t.id;
  document.getElementById("rep").onclick=ses.repetir;
  if(ses.tipo==="tema")document.getElementById("fal").onclick=()=>empezarTema(tid,"falladas");
  else document.getElementById("aj").onclick=ses.ajustes;
  document.getElementById("vol").onclick=volverTemas;
  arriba();
}

/* ---------- Simulacro ---------- */
const PENAS=[["0","No restan"],["0.25","Cada fallo resta 1/4"],["0.3333333333","Cada fallo resta 1/3"],["0.5","Cada fallo resta 1/2"],["1","Cada fallo resta 1"]];
function configSimulacro(){
  pararReloj();
  const o=opo, cfgKey="sim:"+o.id;
  const cfg=Object.assign({n:50,min:60,pena:"0.3333333333"},SIM_DEF[o.id]||{},o.sim||{},datos._cfg[cfgKey]);
  const total=reunir(o.temas.map(t=>({o,t}))).length;
  let h=`<button class="volver" id="vol">← ${esc(corto(o))}</button>
  <h1>Simulacro de examen</h1><p class="lead">${esc(o.nombre)}. Preguntas al azar de todos los temas, con reloj. No verás si aciertas hasta entregar. Puedes dejar preguntas en blanco y cambiar respuestas.</p>
  <p class="aviso">Pon el número de preguntas, el tiempo y la penalización que digan las bases de tu convocatoria.</p>
  <div class="campos">
    <label>Preguntas<input type="number" id="n" min="5" max="${total}" value="${Math.min(cfg.n,total)}" inputmode="numeric"></label>
    <label>Minutos<input type="number" id="min" min="1" max="300" value="${cfg.min}" inputmode="numeric"></label>
    <label class="ancho">Penalización<select id="pena">${PENAS.map(([v,t])=>`<option value="${v}" ${v===cfg.pena?"selected":""}>${t}</option>`).join("")}</select></label>
  </div>
  ${REAL[o.id]?`<p class="resumen">${esc(REAL[o.id].bases)} Al acabar verás también los puntos que sacarías en el examen real.</p>`:""}
  <p class="resumen">Hay ${total} preguntas distintas en esta oposición. La nota se calcula sobre 10: (aciertos − fallos × penalización) ÷ preguntas × 10. Las que dejes en blanco no restan, pero pasarán a «Repasar falladas».</p>
  <button class="btn siguiente" id="go">Empezar el simulacro</button>`+historial(o.id);
  app.innerHTML=h;
  document.getElementById("vol").onclick=()=>temas(o.id,OPOSICIONES.length===1);
  document.getElementById("go").onclick=()=>{
    const n=Math.max(1,Math.min(total,parseInt(document.getElementById("n").value)||50));
    const min=Math.max(1,Math.min(300,parseInt(document.getElementById("min").value)||60));
    const pena=document.getElementById("pena").value;
    datos._cfg[cfgKey]={n,min,pena};guardar(datos);
    const items=barajar(reunir(o.temas.map(t=>({o,t})))).slice(0,n).map(it=>Object.assign(it,{ops:opciones(it.p),resp:null}));
    ses={tipo:"simulacro",oid:o.id,items,i:0,pena:+pena,fin:Date.now()+min*60000,min,inicio:Date.now()};
    pararReloj();
    reloj=setInterval(tic,1000);
    simPregunta();
  };
  arriba();
}
function historial(oid){
  const l=datos._sims.filter(x=>x.o===oid).slice(-10);
  if(!l.length)return "";
  const R_=REAL[oid], tope=R_?(R_.max||R_.preguntas*R_.acierto):10;
  const val=x=>R_&&x.pts!=null?x.pts:x.nota;
  const W=300,H=90,pad=6, xs=i=>l.length===1?W/2:pad+i*(W-2*pad)/(l.length-1), ys=v=>H-pad-(v/tope)*(H-2*pad);
  const pts=l.map((x,i)=>xs(i).toFixed(1)+","+ys(val(x)).toFixed(1)).join(" ");
  const ap=R_&&R_.aprobado!=null?`<line x1="0" x2="${W}" y1="${ys(R_.aprobado)}" y2="${ys(R_.aprobado)}" stroke="var(--brass)" stroke-dasharray="4 4"/>`:"";
  let h=`<h2 class="apartado">Tus últimos simulacros</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de tus notas en los simulacros" style="display:block;background:var(--card);border:1px solid var(--line);border-radius:6px">${ap}<polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2"/>${l.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(val(x))}" r="3.5" fill="var(--green)"/>`).join("")}</svg><ul class="por-tema">`;
  l.slice().reverse().forEach(x=>{const [y,m,d]=x.f.split("-");h+=`<li><span>${+d}/${+m} · ${x.A} bien, ${x.F} mal, ${x.B} en blanco de ${x.n}</span><b>${R_&&x.pts!=null?fmt(x.pts)+" de "+fmt(tope):fmt(x.nota)+" /10"}</b></li>`});
  return h+'</ul>'+(ap?'<p class="resumen">La línea discontinua es la nota mínima para aprobar.</p>':"");
}
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function tic(){
  if(!ses||ses.tipo!=="simulacro"){pararReloj();return}
  const quedan=ses.fin-Date.now(), el=document.getElementById("reloj");
  if(el){el.textContent=mmss(quedan);el.classList.toggle("poco",quedan<5*60000)}
  if(quedan<=0){pararReloj();ses.agotado=true;simResultado()}
}
function simPregunta(){
  const it=ses.items[ses.i], n=ses.items.length, resp=ses.items.filter(x=>x.resp!=null).length;
  let h=`<div class="barra"><button id="salir">Salir</button><span>Pregunta ${ses.i+1} de ${n}</span><span class="reloj" id="reloj">${mmss(ses.fin-Date.now())}</span></div>
  <div class="progreso"><i style="width:${(resp/n)*100}%"></i></div>
  <p class="pregunta">${esc(it.p.q)}</p><div class="opciones">`;
  it.ops.forEach((o,k)=>{h+=`<button class="op${it.resp===k?" sel":""}" data-k="${k}" aria-pressed="${it.resp===k}"><b>${"abcd"[k]})</b><span>${esc(o.txt)}</span></button>`});
  h+=`</div><p class="pista">${it.resp==null?"Sin responder.":"Toca otra vez tu respuesta para dejarla en blanco."}</p>
  <div class="nav"><button class="btn sec" id="ant" ${ses.i?"":"disabled"}>← Anterior</button><button class="btn" id="sig">${ses.i===n-1?"Revisar":"Siguiente →"}</button></div>
  <details class="mapa"><summary>Ir a una pregunta · ${resp} de ${n} respondidas</summary><div class="rejilla">`;
  ses.items.forEach((x,k)=>{h+=`<button class="${x.resp!=null?"hecha":""}${k===ses.i?" actual":""}" data-ir="${k}">${k+1}</button>`});
  h+=`</div></details><button class="btn sec siguiente" id="entregar">Entregar el examen</button>`;
  app.innerHTML=h;
  document.getElementById("salir").onclick=async()=>{if(await pedir("¿Salir del simulacro? No se guardará la nota.","Salir","Seguir")){pararReloj();configSimulacro()}};
  app.querySelectorAll(".op").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;it.resp=it.resp===k?null:k;simPregunta()});
  document.getElementById("ant").onclick=()=>{ses.i--;simPregunta();arriba()};
  document.getElementById("sig").onclick=()=>{if(ses.i<n-1){ses.i++;simPregunta();arriba()}else{app.querySelector(".mapa").open=true;document.getElementById("entregar").scrollIntoView({block:"nearest"})}};
  app.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>{ses.i=+b.dataset.ir;simPregunta();arriba()});
  document.getElementById("entregar").onclick=()=>{
    const blancas=n-ses.items.filter(x=>x.resp!=null).length;
    pedir(blancas?`Tienes ${blancas} en blanco. ¿Entregar el examen?`:"¿Entregar el examen?","Entregar","Seguir").then(y=>{if(y&&ses&&ses.tipo==="simulacro"){pararReloj();simResultado()}});
  };
}
function simResultado(){
  pararReloj();
  const its=ses.items, n=its.length;
  let A=0,F=0,B=0;
  its.forEach(it=>{
    if(it.resp==null){B++;it.ok=false;registrar(it.p,false)}
    else{it.ok=it.ops[it.resp].ok;if(it.ok)A++;else F++;registrar(it.p,it.ok)}
  });
  const nota=Math.max(0,(A-F*ses.pena)/n*10);
  const usado=Math.min(ses.min*60000,Date.now()-ses.inicio);
  const penaTxt=(PENAS.find(([v])=>+v===ses.pena)||[,""])[1].toLowerCase();
  const agot=ses.agotado;
  let h=`<h1>Resultado del simulacro</h1>${agot?'<p class="aviso">Se ha acabado el tiempo. Se ha entregado lo que tenías respondido.</p>':""}<p class="nota">${nota.toFixed(2).replace(".",",")}</p>
  <p class="lead">Sobre 10. ${pl(A,"acierto","aciertos")}, ${pl(F,"fallo","fallos")} y ${B} en blanco de ${n}. Tiempo: ${mmss(usado)} de ${ses.min}:00. ${penaTxt?penaTxt.charAt(0).toUpperCase()+penaTxt.slice(1)+".":""}</p>
  <div class="acciones"><button class="btn" id="rep">Otro simulacro</button><button class="btn sec" id="vol">Volver a los temas</button></div>`;
  const R_=REAL[ses.oid];
  if(R_){
    const bruto=(A*R_.acierto-F*R_.fallo)*(R_.preguntas/n);
    const tope=R_.max||R_.preguntas*R_.acierto;
    const pts=Math.max(0,Math.min(tope,bruto));
    let ver="";
    if(R_.aprobado!=null)ver=pts>=R_.aprobado?`<div class="veredicto si">Aprobarías: ${fmt(pts-R_.aprobado)} puntos por encima del mínimo (${fmt(R_.aprobado)}).</div>`:`<div class="veredicto no">No llegarías: te faltan ${fmt(R_.aprobado-pts)} puntos para el ${fmt(R_.aprobado)}.</div>`;
    ses.pts=pts;
    h+=`<div class="real"><div>En el examen real sacarías</div><div class="pts">${fmt(pts)} <small style="font-size:1rem;color:var(--soft)">de ${fmt(tope)}</small></div>${ver}<p>${n===R_.preguntas?"":`Calculado a escala de ${R_.preguntas} preguntas, como el examen. `}${esc(R_.bases)}</p></div>`;
  }
  datos._sims.push({o:ses.oid,f:hoyISO(),nota:+nota.toFixed(2),pts:ses.pts!=null?+ses.pts.toFixed(2):null,n,A,F,B});
  datos._sims=datos._sims.slice(-60);guardar(datos);
  h+=historial(ses.oid);
  h+=tablaTemas(its,false);
  h+=listaFallos(its.filter(it=>!it.ok),true);
  app.innerHTML=h;
  ses={tipo:"hecho"};
  document.getElementById("rep").onclick=configSimulacro;
  document.getElementById("vol").onclick=volverTemas;
  arriba();
}
{const h=decodeURIComponent((location.hash||"").slice(1));OPOSICIONES.some(o=>o.id===h)?temas(h,OPOSICIONES.length===1):portada();}
(async()=>{
  try{
    const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!db)return;
    avisosCol=db.collection("avisos");
    const ref=db.collection("progreso").doc("datos");
    const snap=await ref.get();
    syncDoc=ref;
    const remoto=snap.exists?snap.data():null;
    if(remoto&&remoto.json&&(remoto.t||0)>(datos._t||0)){
      try{
        const r=JSON.parse(remoto.json);
        datos=r;datos._conf=datos._conf||{};datos._leido=datos._leido||{};datos._secs=datos._secs||{};datos._sup=datos._sup||{};datos._q=datos._q||{};datos._cfg=datos._cfg||{};datos._sr=datos._sr||{};datos._dia=datos._dia||{};datos._sims=datos._sims||[];datos._hist=datos._hist||{};datos._dias=datos._dias||Object.assign({},datos._dia);
        try{localStorage.setItem(KEY,JSON.stringify(datos))}catch(e){}
      }catch(e){}
    }else if(Object.keys(datos).some(k=>!k.startsWith("_"))||Object.keys(datos._q||{}).length){
      await subir();
    }
    if(datos._avisos&&datos._avisos.length){
      const pend=datos._avisos.slice();datos._avisos=[];
      for(const a of pend){try{await avisosCol.doc(a.k.replace(/[^A-Za-z0-9_\-.]/g,"_")+"-"+a.t).set(a)}catch(e){datos._avisos.push(a)}}
      guardar(datos);
    }
    if(!ses)(opo?temas(opo.id,OPOSICIONES.length===1):portada());
  }catch(e){}
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
