<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}img.punto.foto{width:44px;height:44px;border-radius:10px;object-fit:cover}
.foto-btn{cursor:pointer}
.manos-btn{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:8px;width:100%;color:inherit;font:inherit}
.manos-btn[aria-pressed="true"]{border-color:var(--mostaza)}
body.manos .contador button{width:72px;height:72px;font-size:2.2rem}
body.manos .contador .mas{width:88px;height:88px}
body.manos .contador .n{font-size:2.6rem}

</style></head><body>
<title>Mis labores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: lista de labores → una labor como hoja de trabajo: pasos plegables con instrucciones que se tachan, y una barra fija abajo con el contador de filas. */
:root{
  --bg:#EEF0EA; --card:#FBFBF8; --ink:#25291F; --soft:#666E5E; --line:#D6DACD;
  --mostaza:#B98A12; --mostaza-bg:#F6EBC8; --crudo:#E9E2CF; --ok:#3F7A4E; --ok-bg:#E1EEDF;
  --f-display:"Bitter", Georgia, serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171A15; --card:#20241D; --ink:#E9ECE3; --soft:#A2AA98; --line:#353B30;
  --mostaza:#E2B640; --mostaza-bg:#3A3018; --crudo:#3A3629; --ok:#86C795; --ok-bg:#1F3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171A15; --card:#20241D; --ink:#E9ECE3; --soft:#A2AA98; --line:#353B30;
  --mostaza:#E2B640; --mostaza-bg:#3A3018; --crudo:#3A3629; --ok:#86C795; --ok-bg:#1F3324; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding-block:20px 140px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.6rem,6vw,2.1rem)}
h2{font-size:1.15rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mostaza);outline-offset:2px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:800}
.sub{color:var(--soft);margin:4px 0 0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--soft);text-align:center}
/* Lista */
.labor{display:grid;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.labor:hover{border-color:var(--mostaza)}
.labor .meta{display:flex;justify-content:space-between;gap:12px;color:var(--soft);font-size:.9rem;font-variant-numeric:tabular-nums}
.barra{height:8px;border-radius:999px;background:var(--crudo);overflow:hidden}
.barra i{display:block;height:100%;background:var(--mostaza);border-radius:999px;transition:width .3s}
/* Labor */
.top{display:grid;gap:8px}
.volver{background:none;border:0;padding:4px 0;color:var(--soft);font-weight:800;justify-self:start}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;background:var(--ink);color:var(--card)}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
details.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.info summary{cursor:pointer;font-weight:800}
details.info dl{margin:10px 0 0;display:grid;gap:8px}
details.info dt{font-weight:800}
details.info dd{margin:0;color:var(--soft)}
.var{display:grid;gap:4px;background:var(--mostaza-bg);border-radius:10px;padding:12px 14px}
.var label{font-weight:800}
.var .fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.var input{width:90px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums}
.var small{color:var(--soft)}
.paso{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.paso > summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.paso > summary::-webkit-details-marker{display:none}
.paso .cuenta{font-size:.85rem;color:var(--soft);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.paso.hecho .cuenta{color:var(--ok)}
.paso.hecho h2{color:var(--soft)}
.paso .cuerpo{padding:0 16px 16px;display:grid;gap:10px}
.paso .intro{margin:0;color:var(--soft)}
ol.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:transparent;border:1.5px solid transparent;border-radius:10px;padding:10px 10px}
.item .caja{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;background:var(--card)}
.item .caja svg{width:15px;height:15px;opacity:0}
.item .txt{min-width:0}
.item .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:1px;background:var(--crudo);color:var(--ink)}
.item .tag.m{background:var(--mostaza-bg);color:var(--mostaza)}
.item.hecho .txt{color:var(--soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--soft) 60%,transparent)}
.item.hecho .caja{background:var(--ok);border-color:var(--ok);color:var(--card)}
.item.hecho .caja svg{opacity:1}
.item.aqui{border-color:var(--mostaza);background:var(--mostaza-bg)}
.item.aqui .caja{border-color:var(--mostaza)}
.item .aqui-txt{display:block;font-size:.75rem;font-weight:800;color:var(--mostaza);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.check{margin:0;font-size:.92rem;border-left:3px solid var(--ok);padding:2px 0 2px 10px}
.vn{font-weight:800;background:var(--mostaza-bg);border-radius:4px;padding:0 4px}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;resize:vertical}
.estado{font-size:.85rem;color:var(--soft)}
.ocultos{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--soft);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px}
.vueltas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px 44px}
.vueltas .vt{min-width:40px;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.vueltas .vt.hecha{background:var(--line);color:var(--soft);text-decoration:line-through}
.vueltas .vt.sig{outline:2px solid currentColor;outline-offset:1px}
.vueltas .falta{font-size:.85rem;color:var(--soft)}
.ocultos button{background:none;border:0;padding:4px 0;color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
/* Pestañas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.92rem;font-weight:800;color:var(--soft)}
.tabs button[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.form{display:grid;gap:8px}
.form .fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form input[type=text],.form input[type=url],.form input[type=number]{flex:1 1 140px;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.form input[type=color]{width:46px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.lana{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.punto{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line)}
.lana .nm{font-weight:800}.lana small{display:block;color:var(--soft)}
.mini{display:flex;align-items:center;gap:4px}
.mini button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-weight:800}
.mini .n{min-width:2.2em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.borrar{background:none;border:0;color:var(--soft);font-size:.85rem;text-decoration:underline;padding:4px 0;justify-self:start}
.mats{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mats li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.mats .si{color:var(--ok);font-weight:800}.mats .no{color:#B4452F;font-weight:800}
.mats small{color:var(--soft)}
details.dibujo{margin:4px 0 6px 44px}
details.dibujo summary{cursor:pointer;font-weight:800;font-size:.9rem;color:var(--mostaza)}
details.dibujo svg{width:100%;height:auto;max-width:420px;display:block;margin-top:8px}
.term{border-bottom:1.5px dotted var(--mostaza);cursor:help}
.glosa{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--card);padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.glosa .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.glosa b{font-family:var(--f-display)}.glosa p{margin:4px 0 0}
.glosa button{background:none;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font-weight:800}
.galeria{display:grid;gap:14px}
.galeria img{width:100%;border-radius:10px;display:block;aspect-ratio:4/3;object-fit:cover;background:var(--crudo)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.8rem;background:var(--crudo);border-radius:999px;padding:2px 9px}
/* Barra fija del contador */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.dock .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.dock .donde{min-width:0}
.dock .donde b{display:block;font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .donde span{font-size:.82rem;color:var(--soft)}
.contador{display:flex;align-items:center;gap:6px}
.contador button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:1.4rem;font-weight:800;line-height:1}
.contador .mas{background:var(--mostaza);border-color:var(--mostaza);color:#fff;width:52px;height:52px}
.contador .n{min-width:3ch;text-align:center;font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.dock .sig{grid-column:1/-1}
.dock .sig .btn{width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main id="app"><div class="empty">Cargando tus labores…</div></main>
<div class="dock" id="dock" hidden></div>

<script>
(function(){
  const app=document.getElementById("app"), dock=document.getElementById("dock");
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  let db=null, patrones=[], prog={}, actual=null, abiertos=new Set(), guardarT={};
  let lanas=[], ideas=[], terminadas=[], assets=null, vista="labores";
  try{vista=localStorage.getItem("labores-vista")||"labores"}catch(e){}
  let ocultar=true; try{ocultar=localStorage.getItem("labores-ocultar")!=="no"}catch(e){}
  const LS="labores-progreso-v1";
  try{prog=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}

  function P(id){prog[id]=prog[id]||{done:{},cont:{},vars:{},notas:"",t:0};const p=prog[id];p.done=p.done||{};p.cont=p.cont||{};p.vars=p.vars||{};return p}
  function guardar(id){
    const p=P(id);p.t=Date.now();
    try{localStorage.setItem(LS,JSON.stringify(prog))}catch(e){}
    const est=document.getElementById("estado");
    if(!db){if(est)est.textContent="Guardado en este dispositivo.";return}
    clearTimeout(guardarT[id]);
    guardarT[id]=setTimeout(async()=>{
      try{await db.collection("progreso").doc(id).set({json:JSON.stringify(p),t:p.t});if(est)est.textContent="Guardado en tu cuenta."}
      catch(e){if(est)est.textContent="No se ha podido guardar en tu cuenta; queda en este dispositivo."}
    },700);
  }
  const todos=pat=>pat.secciones.flatMap(s=>s.items.map(it=>({...it,sec:s})));
  function avance(pat){const it=todos(pat),p=P(pat.id);const h=it.filter(x=>p.done[x.id]).length;return {h,n:it.length,pct:it.length?h/it.length:0}}
  function siguiente(pat){const p=P(pat.id);return todos(pat).find(x=>!p.done[x.id])||null}
  function texto(pat,t){
    const p=P(pat.id);
    let h=esc(t).replace(/\{(\w+)\}/g,(m,k)=>{const v=p.vars[k];return v?`<span class="vn">${esc(v)}</span>`:`<span class="vn">las mismas</span>`});
    h=h.replace(/^(Crudo|Banda|Extremo A|Extremo B|7\.\d) · /,(m,k)=>`<span class="tag${/Banda|Extremo/.test(k)?" m":""}">${k}</span>`);
    return conGlosario(h);
  }

  /* Vueltas de un rango (it.vueltas=[desde,hasta]; hasta puede ser el id de una variable) */
  function rangoV(pat,it){
    let rg=it.vueltas, pref=it.pref||"";
    if(!rg){ /* detecta rangos en el texto: «Filas 7 a 13», «Filas B1 a B8», «Vueltas 2 y 3», «Filas siguientes … hasta {var} filas» */
      const m=String(it.t).match(/\b(?:Filas|Vueltas)\s+(B?)(\d+)\s+(?:a|y|al)\s+\1?(\d+)/i);
      if(m){rg=[+m[2],+m[3]];pref=m[1]||""}
      else{const v=String(it.t).match(/^(?:[^·]*·\s*)?(?:Filas|Vueltas) siguientes[\s\S]*?hasta \{(\w+)\} (?:filas|vueltas)/i);if(v)rg=[2,v[1]]}
    }
    if(!rg)return null; const p=P(pat.id); let [a,b]=rg;
    const vid=typeof b==="string"?b:null; if(vid){b=p.vars[vid]||0}
    a=+a||1; b=+b||0; if(b<a)return {falta:true,vid};
    const L=[]; for(let n=a;n<=b&&L.length<200;n++)L.push(n); return {lista:L,pref};
  }
  const vk=(it,n)=>it.id+"#"+n;
  const vHecha=(p,it,n)=>!!(p.done[vk(it,n)]||p.done[it.id]);

  /* ---------- Diccionario de puntos ---------- */
  const GLOS={
    "cad":["Cadeneta (cad)","Lazada y sácala por el bucle que tienes en el ganchillo. Cada vez que lo haces es 1 cadeneta."],
    "pb":["Punto bajo (pb)","Pincha en el punto, lazada y saca (2 bucles en el ganchillo), lazada y ciérralos los 2 a la vez."],
    "mpa":["Medio punto alto (mpa)","Lazada antes de pinchar, pincha, lazada y saca (3 bucles), lazada y cierra los 3 a la vez. En inglés: half double crochet (hdc)."],
    "pa":["Punto alto (pa)","Lazada, pincha, lazada y saca (3 bucles); lazada y cierra 2; lazada y cierra los 2 últimos."],
    "pd":["Punto deslizado (pd)","Pincha, lazada y sácala directamente por el punto y por el bucle del ganchillo, todo de una vez. Sirve para cerrar vueltas, unir y moverte sin añadir altura."],
    "HT":["Solo por la hebra de atrás (HT)","Cada punto tiene arriba dos hebras en forma de V. Pincha solo por la de atrás (la más alejada de ti): la de delante queda libre formando una línea."],
    "hebra de atrás":["Hebra de atrás","De las dos hebras en V que tiene cada punto por arriba, la más alejada de ti."],
    "hebra libre de delante":["Hebra libre de delante","La que queda suelta cuando la vuelta anterior se tejió solo por la hebra de atrás. Sirve para unir otra pieza."],
    "punto cangrejo":["Punto cangrejo","Es un pb tejido hacia atrás, de izquierda a derecha (si eres diestra). Hace un borde con forma de cordoncillo."],
    "anillo mágico":["Anillo mágico","Haz un bucle con la hebra alrededor de los dedos, teje los puntos de la vuelta 1 dentro del bucle y al final tira de la hebra corta para cerrar el agujero."],
    "punto arroz":["Punto arroz","En la misma fila se alternan 1 pb y 1 pa. Al girar, cada pb va encima de un pa y cada pa encima de un pb."],
    "lazada":["Lazada","Pasar la hebra por encima del ganchillo, de atrás hacia delante."],
    "ojal":["Ojal","Hueco para un botón o un cordón: se hacen cadenetas y se saltan los mismos puntos de abajo; en la fila siguiente se teje dentro del hueco."],
    "marcador":["Marcador","Una pinza o anilla que se pone en un punto para encontrarlo luego (el primero de la vuelta, una esquina…)."],
    "remata":["Rematar","Corta la hebra dejando un trozo, haz cad 1 y tira para sacar la hebra entera por el bucle: así no se deshace."]
  };
  const GLOS_RE=new RegExp("(?<![\\wáéíóúñÁÉÍÓÚÑ])("+Object.keys(GLOS).sort((a,b)=>b.length-a.length).map(k=>k.replace(/ /g,"\\s")).join("|")+")(?![\\wáéíóúñÁÉÍÓÚÑ])","gi");
  const glosKey=t=>{const l=t.replace(/\s+/g," ");return Object.keys(GLOS).find(k=>k===l)||Object.keys(GLOS).find(k=>k.toLowerCase()===l.toLowerCase())};
  function conGlosario(h){return h.split(/(<[^>]+>)/).map(x=>x.startsWith("<")?x:x.replace(GLOS_RE,(m)=>{const k=glosKey(m);return k?`<span class="term" data-term="${esc(k)}" role="button" tabindex="0">${m}</span>`:m})).join("")}
  let glosaEl=null;
  function mostrarGlosa(k){
    const g=GLOS[k]; if(!g)return; if(!glosaEl){glosaEl=document.createElement("div");glosaEl.className="glosa";glosaEl.setAttribute("role","dialog");document.body.appendChild(glosaEl)}
    glosaEl.innerHTML=`<div class="in"><div><b>${esc(g[0])}</b><p>${esc(g[1])}</p></div><button type="button" id="glosa-x">Cerrar</button></div>`;
    glosaEl.hidden=false; glosaEl.querySelector("#glosa-x").onclick=()=>{glosaEl.hidden=true};
  }
  app.addEventListener("click",ev=>{const t=ev.target.closest&&ev.target.closest(".term");if(t){ev.preventDefault();ev.stopPropagation();mostrarGlosa(t.dataset.term)}},true);
  app.addEventListener("keydown",ev=>{const t=ev.target.closest&&ev.target.closest(".term");if(t&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();ev.stopPropagation();mostrarGlosa(t.dataset.term)}},true);

  /* ---------- Lanas de una labor frente a Mis lanas ---------- */
  const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  function tengoLana(m){
    const claves=(m.buscar&&m.buscar.length?m.buscar:[m.color]).map(norm);
    return lanas.find(l=>(l.ovillos||0)>0&&claves.some(c=>norm(l.color).includes(c)||c.includes(norm(l.color))))||null;
  }
  function textoCompra(pat){
    const falta=(pat.lanas||[]).filter(m=>!tengoLana(m)).map(m=>`- Lana ${m.color}${m.cant?` (${m.cant})`:""}`);
    const otros=(pat.otros||[]).map(o=>`- ${o}`);
    return `Lista de la compra · ${pat.titulo}\n`+(falta.length?falta.join("\n"):"- Lana: tienes todo")+(otros.length?"\n"+otros.join("\n"):"");
  }
  function bloqueMateriales(pat){

    const otros=(pat.otros||[]).map(o=>`<li><span aria-hidden="true">·</span><span>${esc(o)}</span></li>`).join("");
    const nf=(pat.lanas||[]).filter(m=>!tengoLana(m)).length;
    return `<details class="info"${nf?" open":""}><summary>Lanas y materiales ${nf?`· te faltan ${nf}`:"· tienes todas las lanas"}</summary>
      <ul class="mats" style="margin-top:10px">${filas}${otros}</ul>
      <div class="acciones" style="margin-top:10px"><button class="btn sec" id="copiar-compra">Copiar lista de la compra</button>${nf||(pat.otros||[]).length?`<button class="btn sec" id="tarea-compra">Apuntarla en mis tareas</button>`:""}<span class="estado" id="compra-estado" role="status"></span></div>

  function copiar(txt,est){
    const ok=()=>{if(est)est.textContent="Copiada. Pégala en tus notas o en WhatsApp."};
    try{navigator.clipboard.writeText(txt).then(ok,()=>fallback())}catch(e){fallback()}
    function fallback(){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){if(est)est.textContent="No se ha podido copiar."}ta.remove()}

  /* ---------- Lista ---------- */

  /* ---------- Una labor ---------- */
  function abrir(id){
    actual=patrones.find(p=>p.id===id); if(!actual)return lista();
    const s=siguiente(actual); abiertos=new Set(s?[s.sec.id]:[]);

  function pintar(irAlActual){
    const pat=actual,p=P(pat.id),a=avance(pat),sig=siguiente(pat);
    let h=`<header class="top"><button class="volver" id="volver">← Mis labores</button><h1>${esc(pat.titulo)}</h1><p class="sub">${esc(pat.sub||"")}</p>
      <span class="barra" role="img" aria-label="${Math.round(a.pct*100)} % hecho"><i style="width:${a.pct*100}%"></i></span>
      <div class="acciones">${sig?`<button class="btn" id="ir">Ir a donde lo dejé</button>`:""}${pat.doc?`<a class="btn sec" href="${esc(pat.doc)}" target="_blank" rel="noopener">Patrón completo ↗</a>`:""}</div></header>`;
    if(pat.info&&pat.info.length)h+=`<details class="info"><summary>Medida, abreviaturas y punto</summary><dl>${pat.info.map(i=>Array.isArray(i)?{t:i[0],txt:i[1]}:i).map(i=>`<dt>${esc(i.t)}</dt><dd>${esc(i.txt)}</dd>`).join("")}</dl></details>`;
    h+=bloqueMateriales(pat);
    if(!sig&&a.n){const ya=terminadas.some(x=>x.patron===pat.id);
      h+=`<section class="card"><h2>¡Labor terminada!</h2>${ya?`<p class="sub">Ya está en Terminadas.</p>`:`<p class="sub">Guárdala en tu galería con una foto.</p>${formTerminada({titulo:pat.titulo,lanas:(pat.lanas||[]).map(m=>m.color).join(", "),notas:p.notas||""})}`}</section>`}
    const secHechas=pat.secciones.filter(sec=>sec.items.every(x=>p.done[x.id])).length, itemsHechos=todos(pat).filter(x=>p.done[x.id]).length;
    if(itemsHechos)h+=`<div class="ocultos"><span>${ocultar?`Ocultas: ${secHechas} ${secHechas===1?"paso terminado":"pasos terminados"} y las instrucciones ya hechas.`:"Se ve todo, también lo ya hecho."}</span><button id="toggle-ocultar">${ocultar?"Mostrar todo":"Ocultar lo hecho"}</button></div>`;
    pat.secciones.forEach(sec=>{
      const n=sec.items.length, hh=sec.items.filter(x=>p.done[x.id]).length, hecho=hh===n;
      if(ocultar&&hecho)return;
      h+=`<details class="paso${hecho?" hecho":""}" data-sec="${esc(sec.id)}" ${abiertos.has(sec.id)?"open":""}><summary><h2>${esc(sec.titulo)}</h2><span class="cuenta">${hecho?"Hecho":hh+" de "+n}</span></summary><div class="cuerpo">`;
      if(sec.intro)h+=`<p class="intro">${texto(pat,sec.intro)}</p>`;
      (pat.variables||[]).filter(v=>v.paso===sec.id).forEach(v=>{
        h+=`<div class="var"><label for="var-${esc(v.id)}">${esc(v.label)}</label><div class="fila"><input id="var-${esc(v.id)}" data-var="${esc(v.id)}" type="number" inputmode="numeric" min="1" max="999" value="${esc(p.vars[v.id]||"")}" placeholder="—"><small>${esc(v.ayuda||"")}</small></div></div>`;
      });
      h+=`<ol class="items">`;
      sec.items.forEach(it=>{
        const d=!!p.done[it.id], aqui=sig&&sig.id===it.id;
        if(ocultar&&d)return;
        let vh=""; const R=rangoV(pat,it);
        if(R&&R.falta){const v=(pat.variables||[]).find(x=>x.id===R.vid);vh=`<div class="vueltas"><span class="falta">Apunta «${esc(v?v.label:"el número")}» y aquí saldrá una casilla por vuelta.</span></div>`}
        else if(R){const pref=R.pref||"";const sigN=aqui?R.lista.find(n=>!vHecha(p,it,n)):null;
          vh=`<div class="vueltas" role="group" aria-label="Vueltas">${R.lista.map(n=>{const hv=vHecha(p,it,n);return `<button class="vt${hv?" hecha":""}${n===sigN?" sig":""}" data-vt="${esc(it.id)}" data-n="${n}" aria-pressed="${hv}" aria-label="Vuelta ${pref}${n}">${pref}${n}</button>`}).join("")}</div>`}
        const dib=(pat.dibujos||{})[it.id]||it.dibujo;
        h+=`<li><button class="item${d?" hecho":""}${aqui?" aqui":""}" data-item="${esc(it.id)}" aria-pressed="${d}"><span class="caja">${CHECK}</span><span class="txt">${aqui?'<span class="aqui-txt">Estás aquí</span>':""}${texto(pat,it.t)}</span></button>${vh}${dib?`<details class="dibujo"><summary>Ver dibujo</summary>${dib}</details>`:""}</li>`;
      });
      h+=`</ol>${sec.check?`<p class="check"><b>Comprueba:</b> ${esc(sec.check)}</p>`:""}</div></details>`;
    });
    h+=`<section style="display:grid;gap:8px"><h2>Notas de esta labor</h2><textarea id="notas" placeholder="Cambios que has hecho, filas que te han salido, qué lana usaste…">${esc(p.notas||"")}</textarea>
      <div class="acciones"><button class="btn sec" id="reiniciar">Empezar de nuevo</button></div><span class="estado" id="estado" role="status"></span></section>`;
    app.innerHTML=h;
    pintarDock();
    document.getElementById("volver").onclick=lista;
    const cc=document.getElementById("copiar-compra"); if(cc)cc.onclick=()=>copiar(textoCompra(pat),document.getElementById("compra-estado"));
    const tc=document.getElementById("tarea-compra"); if(tc)tc.onclick=()=>tareaCompra(pat,document.getElementById("compra-estado"));

    const tg=document.getElementById("toggle-ocultar"); if(tg)tg.onclick=()=>{ocultar=!ocultar;try{localStorage.setItem("labores-ocultar",ocultar?"si":"no")}catch(e){};const y=window.scrollY;pintar(false);window.scrollTo(0,y)};
    const ir=document.getElementById("ir"); if(ir)ir.onclick=()=>irActual(true);
    app.querySelectorAll("details.paso").forEach(d=>d.addEventListener("toggle",()=>{d.open?abiertos.add(d.dataset.sec):abiertos.delete(d.dataset.sec)}));
    app.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.item; p.done[id]=!p.done[id]; if(!p.done[id])delete p.done[id];

      const it=todos(pat).find(x=>x.id===b.dataset.vt), R=rangoV(pat,it); if(!R||!R.lista)return;

      const k=vk(it,+b.dataset.n); if(p.done[k])delete p.done[k]; else p.done[k]=true;
      if(R.lista.every(n=>p.done[vk(it,n)])){p.done[it.id]=true;R.lista.forEach(n=>delete p.done[vk(it,n)])}
      guardar(pat.id); const y=window.scrollY; pintar(false); window.scrollTo(0,y);
    });
    app.querySelectorAll("[data-var]").forEach(inp=>inp.onchange=()=>{const v=parseInt(inp.value);if(v>0)p.vars[inp.dataset.var]=v;else delete p.vars[inp.dataset.var];guardar(pat.id);const y=window.scrollY;pintar(false);window.scrollTo(0,y)});
    const ta=document.getElementById("notas"); let tt; ta.oninput=()=>{clearTimeout(tt);tt=setTimeout(()=>{p.notas=ta.value;guardar(pat.id)},600)};
    const re=document.getElementById("reiniciar");
    re.onclick=()=>{
      if(re.dataset.ok){prog[pat.id]={done:{},cont:{},vars:{},notas:p.notas||"",t:0};guardar(pat.id);abiertos=new Set([pat.secciones[0].id]);pintar(true);return}
      re.dataset.ok="1";re.textContent="Toca otra vez para borrar las marcas y los contadores";setTimeout(()=>{if(re.isConnected){delete re.dataset.ok;re.textContent="Empezar de nuevo"}},4000);
    };
    if(irAlActual)irActual(false);
  }
  function irActual(suave){
    const sig=siguiente(actual); if(!sig){window.scrollTo(0,0);return}
    if(!abiertos.has(sig.sec.id)){abiertos.add(sig.sec.id);const d=app.querySelector(`details[data-sec="${sig.sec.id}"]`);if(d)d.open=true}
    const el=app.querySelector(`[data-item="${sig.id}"]`);
    if(el)el.scrollIntoView({block:"center",behavior:suave&&!matchMedia("(prefers-reduced-motion: reduce)").matches?"smooth":"auto"});
  }
  function pintarDock(){
    const pat=actual,p=P(pat.id),sig=siguiente(pat);
    const sec=sig?sig.sec:pat.secciones[pat.secciones.length-1];
    if(!sig){dock.hidden=false;dock.innerHTML=`<div class="in"><div class="donde"><b>¡Labor terminada!</b><span>Todas las instrucciones marcadas.</span></div></div>`;return}
    const con=sec.contador, n=p.cont[sec.id]||0;
    const R=rangoV(pat,sig), vSig=R&&R.lista?R.lista.find(x=>!vHecha(p,sig,x)):null;
    dock.hidden=false;
    dock.innerHTML=`<div class="in"><div class="donde"><b>${esc(sec.titulo)}</b><span>${con?`${esc(con)} en este paso`:"Paso sin contador"}</span></div>
      ${con?`<div class="contador"><button id="menos" aria-label="Restar una">−</button><span class="n" id="cn" aria-live="polite">${n}</span><button class="mas" id="mas" aria-label="Sumar una">+</button></div>`:"<span></span>"}
      <div class="sig"><button type="button" class="manos-btn" id="manos" aria-pressed="${manos}">${manos?"Salir de manos ocupadas":"Manos ocupadas"}</button><button class="btn" id="hecha">${vSig?`Hecha la vuelta ${esc((R.pref||"")+vSig)}`:"Hecho, siguiente instrucción"}</button></div></div>`;
    if(con){
      const set=v=>{p.cont[sec.id]=Math.max(0,v);document.getElementById("cn").textContent=p.cont[sec.id];guardar(pat.id)};
      document.getElementById("mas").onclick=()=>set((p.cont[sec.id]||0)+1);
      document.getElementById("menos").onclick=()=>set((p.cont[sec.id]||0)-1);
    }
    document.getElementById("manos").onclick=()=>modoManos(!manos);
    document.getElementById("hecha").onclick=()=>{
      if(vSig){p.done[vk(sig,vSig)]=true; if(R.lista.every(x=>p.done[vk(sig,x)])){p.done[sig.id]=true;R.lista.forEach(x=>delete p.done[vk(sig,x)])}
        guardar(pat.id); const y=window.scrollY; pintar(false); if(p.done[sig.id])irActual(true); else window.scrollTo(0,y); return}
      p.done[sig.id]=true;guardar(pat.id);pintar(false);irActual(true)};
  }

  /* ---------- Manos ocupadas: botones grandes y pantalla siempre encendida mientras tejes ---------- */
  let manos=false, cerrojo=null;
  try{manos=localStorage.getItem("labores-manos")==="1"}catch(e){}
  async function pantallaEncendida(si){
    try{ if(si&&!cerrojo&&navigator.wakeLock)cerrojo=await navigator.wakeLock.request("screen"); if(!si&&cerrojo){await cerrojo.release();cerrojo=null} }catch(e){cerrojo=null}
  }
  function modoManos(si){
    manos=si; document.body.classList.toggle("manos",si);
    try{localStorage.setItem("labores-manos",si?"1":"0")}catch(e){}
    pantallaEncendida(si); if(actual)pintarDock();
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&manos){cerrojo=null;pantallaEncendida(true)}});
  document.body.classList.toggle("manos",manos); if(manos)pantallaEncendida(true);

  /* ---------- Datos ---------- */
  const CACHE="labores-patrones-v1";
  const leerPatrones=docs=>docs.filter(d=>d.exists).map(d=>{try{const v=d.data()||{};const j=typeof v.json==="string"?JSON.parse(v.json):v.json;j.id=d.id;j.orden=v.orden||0;if(!j.lanas&&v.lanas)j.lanas=v.lanas;if(!j.otros&&v.otros)j.otros=v.otros;if(v.dibujos)j.dibujos=Object.assign({},j.dibujos||{},v.dibujos);return j}catch(e){return null}}).filter(Boolean).sort((a,b)=>a.orden-b.orden);
  let pintado=false;
  function ponerPatrones(lst,guardarCache){
    patrones=lst; pintado=true;
    if(guardarCache){try{localStorage.setItem(CACHE,JSON.stringify(lst))}catch(e){}}
    if(actual){actual=patrones.find(p=>p.id===actual.id)||null; actual?pintar(false):lista()}
    else{const h=(location.hash||"").slice(1); patrones.some(p=>p.id===h)?abrir(h):lista()}
  }
  async function iniciar(){
    /* Lo último que se vio en este dispositivo, al momento; luego se pone al día con la hoja */
    try{const c=JSON.parse(localStorage.getItem(CACHE)||"null");if(Array.isArray(c)&&c.length)ponerPatrones(c,false)}catch(e){}
    try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
    if(!db){if(!pintado)app.innerHTML=`<div class="empty">No se ha podido conectar con tus labores. Recarga la página.</div>`;return}
    db.collection("progreso").get().then(ps=>{
      ps.docs.filter(d=>d.exists).forEach(d=>{const v=d.data()||{};try{const r=typeof v.json==="string"?JSON.parse(v.json):v.json;const l=prog[d.id];if(r&&(!l||(v.t||0)>(l.t||0)))prog[d.id]=r}catch(e){}});
      if(pintado){if(actual){const y=window.scrollY;pintar(false);window.scrollTo(0,y)}else lista()}
    }).catch(()=>{});
    db.collection("patrones").onSnapshot(snap=>ponerPatrones(leerPatrones(snap.docs),true),
      ()=>{if(!pintado)app.innerHTML=`<div class="empty">No se han podido cargar tus labores.<br><br><button class="btn" onclick="location.reload()">Volver a intentarlo</button></div>`});
    try{assets=window.claude.use?await window.claude.use("assets"):null}catch(e){assets=null}
    const refrescar=(vs)=>{if(actual){const y=window.scrollY;pintar(false);window.scrollTo(0,y)}else if(vs.includes(vista))lista()};
    const sub=(col,set,vs)=>{try{db.collection(col).onSnapshot(snap=>{set(snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...(d.data()||{})})));refrescar(vs)},()=>{})}catch(e){}};
    sub("lanas",v=>lanas=v,["lanas","labores"]);
    sub("ideas",v=>ideas=v,["ideas"]);
    sub("terminadas",v=>terminadas=v,["terminadas"]);
  }
  iniciar();
})();
</script>

</body></html>
